<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UFT-8">
    <meta name="viewport" content="width=device-width, inital-scale=1.0">
    <title>Quantum - {% block title%}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible m-2"> 
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const TIEMPO_ADVERTENCIA = 28 * 60 * 1000; 
const TIEMPO_CIERRE = 30 * 60 * 1000;      
let temporizadorAdvertencia;
let temporizadorCierre;

function reiniciarTemporizadores() {
    clearTimeout(temporizadorAdvertencia);
    clearTimeout(temporizadorCierre);

    temporizadorAdvertencia = setTimeout(function() {
        if (confirm(
            'Tu sesión está a punto de expirar por inactividad. ' +
            '¿Deseas continuar?')) {
            reiniciarTemporizadores();
        } else {
            window.location.href = "{{ url_for('auth.logout') }}";
        }
    }, TIEMPO_ADVERTENCIA);

    temporizadorCierre = setTimeout(function() {
        window.location.href = "{{ url_for('auth.logout') }}";
    }, TIEMPO_CIERRE);
}

document.addEventListener('mousemove', reiniciarTemporizadores);
document.addEventListener('keypress', reiniciarTemporizadores);
document.addEventListener('click', reiniciarTemporizadores);
document.addEventListener('scroll', reiniciarTemporizadores);

reiniciarTemporizadores();
</script>
</body>
